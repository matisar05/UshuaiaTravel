version: '3.8'

services:
  db:
    image: postgis/postgis:14-3.3-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=ushuaia_db
      - POSTGRES_USER=ushuaia_user
      - POSTGRES_PASSWORD=ushuaia_pass
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  core-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://ushuaia_user:ushuaia_pass@db:5432/ushuaia_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      - db
      - redis

  worker-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A ushuaia_travel worker -l info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://ushuaia_user:ushuaia_pass@db:5432/ushuaia_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      - db
      - redis

  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - core-api

volumes:
  postgres_data:
  frontend_node_modules:
