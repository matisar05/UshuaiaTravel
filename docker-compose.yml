version: '3.8'

services:
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=ushuaia_db
      - POSTGRES_USER=ushuaia_user
      - POSTGRES_PASSWORD=ushuaia_pass
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://ushuaia_user:ushuaia_pass@db:5432/ushuaia_db
      - DEBUG=True
    depends_on:
      - db

  frontend:
    # Para desarrollo local no usamos Nginx, sino Node con Vite (hot-reload)
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
