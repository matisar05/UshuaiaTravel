services:
  - type: web
    name: ushuaia-travel-api
    env: python
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python -m playwright install --with-deps chromium
    startCommand: gunicorn ushuaia_travel.wsgi:application --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_ALLOW_ASYNC_UNSAFE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://ushuaia-travel.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ushuaia-travel-db
          property: connectionString
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_SUCCESS_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: GOOGLE_ADSENSE_CLIENT
        sync: false

  - type: static
    name: ushuaia-travel
    env: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://usuhiaia-travel-api.onrender.com/api/*
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://usuhiaia-travel-api.onrender.com/api/v1
      - key: VITE_ADSENSE_CLIENT
        sync: false

databases:
  - name: ushuaia-travel-db
    plan: free
    postgresMajorVersion: 14
    ipAllowList: []
