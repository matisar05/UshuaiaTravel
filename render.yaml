services:
  - type: web
    name: ushuaia-travel
    env: python
    region: oregon
    buildCommand: |
      cd frontend && npm install --legacy-peer-deps && npm run build && cd ..
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      playwright install --with-deps chromium
    startCommand: gunicorn ushuaia_travel.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_ALLOW_ASYNC_UNSAFE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ushuaia-travel-db
          property: connectionString
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: GOOGLE_ADSENSE_CLIENT
        sync: false

databases:
  - name: ushuaia-travel-db
    postgresMajorVersion: 14
    ipAllowList: []
