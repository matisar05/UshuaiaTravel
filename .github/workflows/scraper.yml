name: Daily Hotel Scraper

on:
  schedule:
    - cron: '0 6 * * *'  # 3:00 AM America/Argentina/Ushuaia (Approx 06:00 UTC)
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    services:
      # No necesitamos servicios locales porque usaremos Supabase (DB externa)
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Run Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: "*"
          # Agrega aquí otras variables necesarias para que Django inicie
        run: |
          python manage.py scrape_hotels --platform booking --max-hotels 100 --headless
